name: Android APK

on:
  push:
    branches: ["setup/godot-4.7.2", "android-build/**"]
    paths:
      - ".github/workflows/android-apk.yml"
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build debug APK (Android arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Download Godot 4.7.2 and Android export templates
        run: |
          GODOT_VERSION="4.7.2"
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"

      - name: Configure Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Rift-debug.apk"
          patchers=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="0.1.0"
          package/unique_name="org.rift.zeroedge"
          package/name="Искажение: Нулевая грань"
          package/signed=true
          screen/immersive_mode=true
          screen/edge_to_edge=false
          permissions/internet=true
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF
          sed -i "s|\$HOME|$HOME|g" export_presets.cfg
          mkdir -p build

      - name: Import project
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Export Android APK
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/Rift-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Android-APK
          path: build/Rift-debug.apk
          if-no-files-found: error
          retention-days: 14
