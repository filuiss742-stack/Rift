name: Godot project check

on:
  push:
    branches: [main, "setup/**", "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import and startup check (Godot 4.7.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Startup smoke test
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit
